services:
  neo4j:
    image: neo4j:5.18-community
    container_name: neo4j_movielens
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt (драйвери / cypher-shell)
    environment:
      # логін / пароль для Neo4j Browser та cypher-shell
      NEO4J_AUTH: neo4j/password123
      # авто-встановлення плагінів APOC та Graph Data Science
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      # дозволяємо виклик процедур apoc.* та gds.*
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
      # пам'ять (імена налаштувань Neo4j 5.x: server.memory.*)
      NEO4J_server_memory_heap_initial__size: "2G"
      NEO4J_server_memory_heap_max__size: "8G"
      NEO4J_server_memory_pagecache_size: "2G"
      # ліміт пам'яті однієї транзакції (важкі агрегації у Частині 5)
      NEO4J_dbms_memory_transaction_total_max: "6G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      # папка import/ з CSV — Neo4j читає звідси через LOAD CSV FROM 'file:///...'
      - ./import:/var/lib/neo4j/import

volumes:
  neo4j_data:
  neo4j_logs:
